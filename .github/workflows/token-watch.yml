name: token-watch
on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub can run scheduled jobs a few minutes late when busy)
  workflow_dispatch: {}        # "Run workflow" button for testing
permissions:
  contents: write
concurrency:
  group: token-watch           # never let two runs overlap
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                # always start from the latest code and data (queued runs used to start from old copies)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore price history cache
        uses: actions/cache/restore@v5
        with:
          path: .hist-cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - name: Check coins, send alerts, then answer Telegram messages until the next run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          WHALE_ALERT_API_KEY: ${{ secrets.WHALE_ALERT_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python token_watch.py --once
      - name: Save price history cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .hist-cache
          key: hist-${{ github.run_id }}
      - name: Save results and update the phone dashboard
        if: always()
        run: |
          git config user.name "token-watch"
          git config user.email "token-watch@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Update $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do                         # if another run saved in the meantime, keep this run's newer data
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1
