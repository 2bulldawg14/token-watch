name: delete-trade
# The dashboard's Delete button opens this. Click "Run workflow", paste the trade ID, click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      trade_ids:
        description: "Trade ID(s) to delete (the dashboard copies it for you)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: token-watch              # shares the lane with the 15-minute check; it jumps in right away
  cancel-in-progress: true
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore price history cache
        uses: actions/cache/restore@v5
        with:
          path: .hist-cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - name: Delete the trade(s), check everything, publish the dashboard, then answer Telegram
        env:
          DEL_IDS: ${{ inputs.trade_ids }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python token_watch.py --once --delete-trades "$DEL_IDS"
      - name: Save price history cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .hist-cache
          key: hist-${{ github.run_id }}
      - name: Publish the dashboard if the last update didn't go out
        if: always()
        run: |
          git config user.name "token-watch"
          git config user.email "token-watch@users.noreply.github.com"
          git add -A docs data; [ -f watchlist.txt ] && git add watchlist.txt || true
          if ! git diff --cached --quiet -- docs watchlist.txt; then git commit -q -m "Update $(date -u +'%Y-%m-%d %H:%M')"; fi
          git reset -q --hard HEAD                 # working memory is kept in the cache; only unpublished commits matter here
          git fetch -q origin main
          [ "$(git rev-list --count origin/main..HEAD)" = "0" ] && exit 0   # everything already published
          for i in 1 2 3 4; do                     # catch pushes that failed mid-run (e.g. GitHub "Internal Server Error")
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep $((i*10))
          done
          exit 1
      - name: Tell me on Telegram if this run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Token Watch: the '${{ github.workflow }}' run failed and needs attention. Your dashboard may not have updated. Details: ${RUN_URL}" > /dev/null
