name: add-coin
# The dashboard's "Add a coin" button opens this. Click "Run workflow", type the ticker(s), click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker(s) to add, e.g. SHIB or AAPL (or SHIB, PEPE)"
        required: true
        type: string
      kind:
        description: "Is this a coin or a stock?"
        required: false
        type: choice
        default: "work it out for me"
        options: ["work it out for me", "coin", "stock"]
      star:
        description: "Star it (always alert me)"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: token-watch              # shares the lane with the 15-minute check; it jumps in right away
  cancel-in-progress: true
jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore price history cache
        uses: actions/cache/restore@v5
        with:
          path: .hist-cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - name: Add the coin, check everything, publish the dashboard, then answer Telegram
        env:
          ADD_TICKERS: ${{ inputs.tickers }}
          ADD_STAR: ${{ inputs.star }}
          ADD_KIND: ${{ inputs.kind }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "$ADD_STAR" = "true" ]; then STAR="--star"; else STAR=""; fi
          case "$ADD_KIND" in stock) KIND="--kind stock";; coin) KIND="--kind crypto";; *) KIND="";; esac
          python token_watch.py --once --add "$ADD_TICKERS" $STAR $KIND
      - name: Save price history cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .hist-cache
          key: hist-${{ github.run_id }}
      - name: Publish the dashboard if the last update didn't go out
        if: always()
        run: |
          git config user.name "token-watch"
          git config user.email "token-watch@users.noreply.github.com"
          git add -A docs data; [ -f watchlist.txt ] && git add watchlist.txt || true
          if ! git diff --cached --quiet -- docs watchlist.txt; then git commit -q -m "Update $(date -u +'%Y-%m-%d %H:%M')"; fi
          git reset -q --hard HEAD                 # working memory is kept in the cache; only unpublished commits matter here
          git fetch -q origin main
          [ "$(git rev-list --count origin/main..HEAD)" = "0" ] && exit 0   # everything already published
          for i in 1 2 3 4; do                     # catch pushes that failed mid-run (e.g. GitHub "Internal Server Error")
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep $((i*10))
          done
          exit 1
      - name: Tell me on Telegram if this run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Token Watch: the '${{ github.workflow }}' run failed and needs attention. Your dashboard may not have updated. Details: ${RUN_URL}" > /dev/null
